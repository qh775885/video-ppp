<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视频截图神器</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <header>
    <h1>视频截图神器</h1>
    <span class="version-tag" id="versionTag" title="点击查看作者">v1.0.3</span>
  </header>

  <main>
    <div id="dashboard" class="dashboard">

      <!-- Video Area -->
      <div class="video-area">
        <div class="video-box" id="videoWrapper">
          <video id="videoPlayer" muted playsinline></video>

          <!-- Crop Overlay (for Portrait Mode) -->
          <div class="crop-overlay" id="cropOverlay">
            <div class="crop-box" id="cropBox"></div>
          </div>

          <div class="video-overlay" id="processingOverlay">
            <div class="spinner"></div>
            <span>扫描中...</span>
          </div>

          <div class="drop-hint" id="dropHint">
            <div class="drop-icon">📂</div>
            <p>拖入视频文件</p>
            <small>空格播放 | 右键截图 | ←→快进</small>
          </div>
        </div>
      </div>
      <!-- Control Bar -->
      <div class="control-bar" id="controlBar">

        <!-- Row 1: Progress Track -->
        <div class="control-row progress-row">
          <span id="currentTimeDisplay" class="time-label">00:00</span>
          <div class="seek-wrapper">
            <input type="range" id="videoSeekBar" class="seek-bar" min="0" max="100" value="0" step="0.1">
            <div class="range-selector" id="rangeSelector">
              <div class="range-highlight" id="rangeHighlight"></div>
              <div class="range-handle start" id="rangeStart" title="开始截取位置"></div>
              <div class="range-handle end" id="rangeEnd" title="结束截取位置"></div>
            </div>
          </div>
          <span id="totalTimeDisplay" class="time-label">00:00</span>
        </div>

        <!-- Row 2: Actions & Tools -->
        <div class="control-row action-row">

          <!-- Playback -->
          <button id="playPauseBtn" class="icon-btn large" title="播放/暂停">
            <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>

          <div class="control-divider vertical"></div>

          <!-- Portrait Mode Controls (Click to Toggle) -->
          <div class="portrait-group" id="portraitGroup">
            <div class="portrait-dropdown" id="portraitDropdown">
              <button class="portrait-btn" id="portraitBtn" title="点击开关竖图模式，点击箭头切换比例">
                <span class="portrait-icon">📐</span>
                <span class="portrait-ratio" id="portraitRatio">OFF</span>
                <span class="dropdown-arrow">▾</span>
              </button>
              <div class="portrait-menu" id="portraitMenu">
                <!-- 移除了"关闭"选项，逻辑改为点击主按钮开关 -->
                <div class="menu-header">选择比例</div>
                <div class="menu-item" data-ratio="9:16">9:16 <small>抖音</small></div>
                <div class="menu-item" data-ratio="3:4">3:4 <small>小红书</small></div>
                <div class="menu-item" data-ratio="2:3">2:3 <small>照片</small></div>
                <div class="menu-item" data-ratio="4:5">4:5 <small>INS</small></div>
                <div class="menu-item" data-ratio="1:1">1:1 <small>正方</small></div>
              </div>
            </div>
            <div class="pos-buttons" id="posButtons">
              <button class="pos-btn" data-pos="left" title="左">◀</button>
              <button class="pos-btn active" data-pos="center" title="中">●</button>
              <button class="pos-btn" data-pos="right" title="右">▶</button>
            </div>
          </div>

          <div class="control-divider vertical"></div>

          <!-- Extract Group -->
          <div class="control-actions">
            <div class="extract-combo">
              <input type="number" id="targetCount" class="count-input" value="12" min="1" max="300" title="提取数量">
              <button id="startBtn" class="action-btn extract" title="智能提取">
                <span class="btn-text">⚡ 提取</span>
                <div class="btn-progress" id="btnProgress"></div>
              </button>
              <div class="multiplier-combo">
                <span class="multiplier-label">×</span>
                <input type="number" id="multiplierInput" class="multiplier-input" value="1" min="0.1" max="30"
                  step="0.1" title="倍数：每秒截取的帧数">
                <span class="multiplier-preview" id="multiplierPreview" title="区间时长 → 计算张数">--</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Hidden inputs for logic compatibility -->
        <div style="display:none">
          <input type="text" id="startTimeInput" value="00:00">
          <input type="text" id="endTimeInput" value="00:00">
          <button id="setStartBtn"></button>
          <button id="setEndBtn"></button>
          <button id="btnInc"></button>
          <button id="btnDec"></button>
        </div>
      </div>

      <!-- Right Sidebar (Modern Style) -->
      <div class="sidebar">
        <!-- Section 1: Settings -->
        <div class="sidebar-section">
          <h3 class="section-title">设置</h3>

          <div class="setting-item">
            <label>缓存目录</label>
            <button id="cacheFolderBtn" class="folder-btn" title="点击更改">
              <span id="cacheFolderText" class="folder-path text-truncate">默认目录</span>
            </button>
          </div>

          <div class="setting-item">
            <label>快进秒数 (←/→)</label>
            <div class="number-stepper">
              <input type="number" id="seekStepInput" class="stepper-input" value="5" min="1" max="60">
              <span class="unit">s</span>
            </div>
          </div>
        </div>

        <!-- Section 2: Gallery -->
        <div class="sidebar-section flex-grow">
          <div class="section-header">
            <h3 class="section-title">结果列表</h3>
            <div class="header-actions">
              <span class="badge" id="resultBadge">0</span>
              <button id="clearBtn" class="text-btn">清空</button>
            </div>
          </div>

          <div id="galleryGrid" class="gallery-list">
            <div class="empty-hint">
              <div class="hint-icon">🖼️</div>
              <div>暂无截图</div>
              <small>右键截图 或 点击一键提取</small>
            </div>
          </div>

          <div class="sidebar-footer">
            <button id="downloadBtn" class="full-btn disabled" disabled>
              打开输出文件夹
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
      <button id="btnClose" class="lb-close">&times;</button>
      <button id="btnPrev" class="lb-nav lb-prev">&#10094;</button>
      <div class="lb-content">
        <img id="lightboxImg" src="">
        <div class="lb-footer">
          <span id="lbCount">1 / 10</span>
          <small>(滚轮切换)</small>
        </div>
      </div>
      <button id="btnNext" class="lb-nav lb-next">&#10095;</button>
    </div>

    <input type="file" id="fileInput" accept="video/*" hidden />
  </main>


  <!-- About Modal -->
  <div id="aboutModal" class="about-modal">
    <div class="about-content">
      <button id="aboutClose" class="about-close">&times;</button>
      <h2>视频截图神器</h2>
      <p class="about-version">v1.0.3</p>

      <div class="about-section">
        <h3>⌨️ 快捷键</h3>
        <div class="shortcut-list">
          <div class="shortcut-item"><kbd>右键</kbd><span>截图</span></div>
          <div class="shortcut-item"><kbd>空格</kbd><span>播放/暂停</span></div>
          <div class="shortcut-item"><kbd>←</kbd><span>后退 5 秒</span></div>
          <div class="shortcut-item"><kbd>→</kbd><span>前进 5 秒</span></div>
          <div class="shortcut-item"><kbd>S</kbd><span>截图（备用）</span></div>
        </div>
      </div>

      <div class="about-section">
        <h3>👤 作者</h3>
        <a id="authorLink" class="author-link" href="#">
          <span class="bilibili-icon">📺</span>
          <span>B站主页</span>
        </a>
      </div>
    </div>
  </div>

  <div id="screenshotToast" class="toast">📸 已截图!</div>

  <script type="module" src="/main.js"></script>
</body>

</html>
