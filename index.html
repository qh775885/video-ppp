<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视频截图神器</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <header>
    <h1>视频截图神器</h1>
    <span class="version-tag" id="versionTag" title="点击查看作者">v1.0.0</span>
  </header>

  <main>
    <div id="dashboard" class="dashboard">

      <!-- Video Area -->
      <div class="video-area">
        <div class="video-box" id="videoWrapper">
          <video id="videoPlayer" muted playsinline></video>

          <div class="video-overlay" id="processingOverlay">
            <div class="spinner"></div>
            <span>扫描中...</span>
          </div>

          <div class="drop-hint" id="dropHint">
            <div class="drop-icon">📂</div>
            <p>拖入视频文件</p>
            <small>空格播放 | S截图 | ←→快进 | P拉片</small>
          </div>
        </div>
      </div>

      <!-- Control Bar - Enhanced Layout -->
      <div class="control-bar" id="controlBar">
        <!-- Row 1: Seek Bar with Pick Mode -->
        <div class="bar-row seek-row no-border">
          <!-- Left: Play/Pause + Time -->
          <button id="playPauseBtn" class="icon-btn" title="播放/暂停">
            <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg id="pauseIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          <span id="currentTimeDisplay" class="time-label">00:00</span>

          <!-- Center: Seek Bar -->
          <input type="range" id="videoSeekBar" class="seek-bar" min="0" max="100" value="0" step="0.1">

          <span id="totalTimeDisplay" class="time-label">00:00</span>

          <!-- Right: Actions Group -->
          <div class="control-actions">
            <!-- Pick Mode Toggle -->
            <button id="pickModeBtn" class="mode-toggle-btn" title="拉片选图模式 (P)：拖动进度条松开自动截图">
              <span class="mode-icon">🎯</span>
              <span class="mode-label">拉片</span>
            </button>

            <!-- Screenshot Button -->
            <button id="screenshotBtn" class="action-btn shot" title="截图 (S)">
              📷
            </button>

            <!-- Extract Group -->
            <div class="extract-combo">
              <input type="number" id="targetCount" class="count-input" value="12" min="1" max="300" title="提取数量">
              <button id="startBtn" class="action-btn extract" title="智能提取">
                <span class="btn-text">⚡ 提取</span>
                <div class="btn-progress" id="btnProgress"></div>
              </button>
            </div>
          </div>
        </div>

        <!-- Hidden inputs for logic compatibility -->
        <div style="display:none">
          <input type="text" id="startTimeInput" value="00:00">
          <input type="text" id="endTimeInput" value="00:00">
          <button id="setStartBtn"></button>
          <button id="setEndBtn"></button>
          <button id="btnInc"></button>
          <button id="btnDec"></button>
        </div>
      </div>

      <!-- Gallery Area -->
      <div class="gallery-area">
        <!-- Row 1: Cache Folder -->
        <div class="gallery-row folder-row">
          <button id="cacheFolderBtn" class="folder-btn" title="设置缓存文件夹">
            <span id="cacheFolderText">📂 缓存</span>
          </button>
        </div>
        <!-- Row 2: Result | Clear | Download -->
        <div class="gallery-row result-row">
          <span class="result-label">结果 <b id="resultBadge">0</b></span>
          <button id="clearBtn" class="txt-btn">清空</button>
          <button id="downloadBtn" class="dl-icon-btn" disabled title="下载">
            📥
          </button>
        </div>
        <div id="galleryGrid" class="gallery-list">
          <div class="empty-hint">按S截图<br>或点击提取</div>
        </div>
      </div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
      <button id="btnClose" class="lb-close">&times;</button>
      <button id="btnPrev" class="lb-nav lb-prev">&#10094;</button>
      <div class="lb-content">
        <img id="lightboxImg" src="">
        <div class="lb-footer">
          <span id="lbCount">1 / 10</span>
          <small>(滚轮切换)</small>
        </div>
      </div>
      <button id="btnNext" class="lb-nav lb-next">&#10095;</button>
    </div>

    <input type="file" id="fileInput" accept="video/*" hidden />
  </main>

  <!-- Pick Mode Toast -->
  <div id="pickModeToast" class="pick-mode-toast">
    <span class="toast-icon">🎯</span>
    <span class="toast-text">拉片模式 - 拖动进度条松开即截图</span>
  </div>

  <div id="screenshotToast" class="toast">📸 已截图!</div>

  <script type="module" src="/main.js"></script>
</body>

</html>
